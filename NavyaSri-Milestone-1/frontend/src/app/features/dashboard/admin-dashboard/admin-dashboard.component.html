<div class="bt-page-container">
  <h1 class="bt-section-title">Administrator Dashboard</h1>
  <p class="bt-text-muted">System-wide overview of users and projects.</p>

  <app-loading *ngIf="isLoading()" message="Loading dashboard..."></app-loading>

  <ng-container *ngIf="!isLoading() && data() as d">
    <div class="bt-stats-grid">
      <app-stat-card label="Total Users" [value]="d.total_users" icon="group" accentColor="primary"></app-stat-card>
      <app-stat-card label="Active Users" [value]="d.active_users" icon="how_to_reg" accentColor="success"></app-stat-card>
      <app-stat-card label="Total Projects" [value]="d.total_projects" icon="apartment" accentColor="accent"></app-stat-card>
      <app-stat-card label="Active Projects" [value]="d.active_projects" icon="engineering" accentColor="warning"></app-stat-card>
    </div>

    <div class="bt-card bt-recent-users">
      <h2 class="bt-section-title">Recent Users</h2>
      <table mat-table [dataSource]="d.recent_users" class="bt-full-width" *ngIf="d.recent_users.length; else noUsers">
        <ng-container matColumnDef="full_name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let u">{{ u.full_name }}</td>
        </ng-container>
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let u">{{ u.email }}</td>
        </ng-container>
        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Role</th>
          <td mat-cell *matCellDef="let u">{{ u.role }}</td>
        </ng-container>
        <ng-container matColumnDef="is_active">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let u">
            <mat-chip [color]="u.is_active ? 'primary' : 'warn'" selected disableRipple>
              {{ u.is_active ? 'Active' : 'Inactive' }}
            </mat-chip>
          </td>
        </ng-container>
        <ng-container matColumnDef="created_at">
          <th mat-header-cell *matHeaderCellDef>Joined</th>
          <td mat-cell *matCellDef="let u">{{ u.created_at | date: 'mediumDate' }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
      <ng-template #noUsers>
        <p class="bt-text-muted">No users yet.</p>
      </ng-template>
    </div>
  </ng-container>
</div>
