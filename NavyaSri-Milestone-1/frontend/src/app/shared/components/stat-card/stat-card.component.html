<div class="bt-stat-card bt-card" [class]="'bt-stat-card--' + accentColor">
  <div class="bt-stat-card__icon">
    <mat-icon>{{ icon }}</mat-icon>
  </div>
  <div class="bt-stat-card__body">
    <span class="bt-stat-card__value">{{ value }}</span>
    <span class="bt-stat-card__label">{{ label }}</span>
  </div>
</div>
