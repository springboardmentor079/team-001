<div class="page-heading"><div><span class="eyebrow dark">INBOX</span><h1>Notifications<span class="orange">.</span></h1><p>Updates addressed to your account from project workflows.</p></div>@if (unread()) { <button class="btn" (click)="readAll()">Mark all read</button> }</div>
@if (error()) { <div class="notice error" role="alert">{{ error() }}</div> }
<section class="panel project-info"><div class="activity-list">@for (row of records(); track row.id) { <button class="activity-row notification-row" [class.unread]="!row.readAt" (click)="read(row)"><span class="status-dot"></span><span><strong>{{ row.title }}</strong><small>{{ row.message }}</small></span><time>{{ row.createdAt | date: 'medium' }}</time></button> } @empty { <div class="empty"><h2>You're all caught up</h2><p>New project notifications will appear here.</p></div> }</div></section>
