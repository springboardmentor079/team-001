<div class="auth-page d-flex justify-content-center align-items-center">
  <mat-card class="auth-card p-4">
    <h2 class="mb-3">Reset your password</h2>
    <p class="text-muted mb-4">Enter and confirm your new password.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="w-100 mb-2">
        <mat-label>New password</mat-label>
        <input matInput type="password" formControlName="newPassword" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100 mb-2">
        <mat-label>Confirm new password</mat-label>
        <input matInput type="password" formControlName="confirmPassword" />
      </mat-form-field>

      @if (errorMessage()) {
        <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
      }
      @if (successMessage()) {
        <div class="alert alert-success py-2">{{ successMessage() }}</div>
      }

      <button mat-raised-button color="primary" class="w-100 mt-2" type="submit" [disabled]="loading()">
        Reset password
      </button>
    </form>

    <p class="mt-3 text-center">
      <a routerLink="/login">Back to login</a>
    </p>
  </mat-card>
</div>
