<div class="auth-page d-flex justify-content-center align-items-center">
  <mat-card class="auth-card p-4">
    <h2 class="mb-3">Forgot password</h2>
    <p class="text-muted mb-4">Enter your email and we'll send you a reset link.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="w-100 mb-2">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>

      @if (errorMessage()) {
        <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
      }
      @if (infoMessage()) {
        <div class="alert alert-success py-2">{{ infoMessage() }}</div>
      }

      <button mat-raised-button color="primary" class="w-100 mt-2" type="submit" [disabled]="loading()">
        Send reset link
      </button>
    </form>

    <p class="mt-3 text-center">
      <a routerLink="/login">Back to login</a>
    </p>
  </mat-card>
</div>
