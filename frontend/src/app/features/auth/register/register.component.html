<div class="auth-page d-flex justify-content-center align-items-center">
  <mat-card class="auth-card p-4">
    <h2 class="mb-3">Create Account</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="w-100 mb-2">
        <mat-label>Full Name</mat-label>
        <input matInput formControlName="full_name" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100 mb-2">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100 mb-2">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100 mb-2">
        <mat-label>Role</mat-label>
        <mat-select formControlName="role">
          @for (r of roles; track r.value) {
            <mat-option [value]="r.value">{{ r.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      @if (errorMessage()) {
        <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
      }
      @if (successMessage()) {
        <div class="alert alert-success py-2">{{ successMessage() }}</div>
      }

      <button mat-raised-button color="primary" class="w-100 mt-2" type="submit" [disabled]="loading()">
        Register
      </button>
    </form>

    <p class="mt-3 text-center">
      Already have an account? <a routerLink="/login">Login here</a>
    </p>
  </mat-card>
</div>
